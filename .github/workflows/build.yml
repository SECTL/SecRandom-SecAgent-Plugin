name: Build plugin

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout matching SecRandom host source
        uses: actions/checkout@v4
        with:
          repository: PANDAJSR/SecRandom
          ref: agent/extract-secagent-plugin
          path: SecRandom
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build SRPX
        run: dotnet build SecRandom.SecAgentPlugin.csproj -c Release -p:CreateSrpx=true -p:UseLocalPluginSdk=true -p:LocalSecRandomRoot=${{ github.workspace }}\SecRandom -p:BuildInParallel=false -p:UseSharedCompilation=false
      - name: Upload SRPX
        uses: actions/upload-artifact@v4
        with:
          name: secrandom-secagent-plugin
          path: srpx/*.srpx
